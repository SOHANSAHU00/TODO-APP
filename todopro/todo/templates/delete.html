{% extends "base.html" %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card card-soft border-danger-subtle">
                <div class="card-body p-4 p-lg-5 text-center">
                    <h1 class="h3 fw-bold mb-3">Delete Task</h1>
                    <p class="text-muted mb-4">Are you sure you want to delete the task <strong>"{{ task.title }}"</strong>?</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2">
                            <button type="submit" class="btn btn-danger px-4">Delete</button>
                            <a href="{% url 'index' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
